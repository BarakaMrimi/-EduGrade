{% extends 'base.html' %}
{% load static %}

{% block title %}Assign Teacher - EduGrade{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="fas fa-user-cog"></i> Assign Teacher: {{ teacher.full_name }}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="curriculum" class="form-label">Curriculum <span class="text-danger">*</span></label>
                            <select class="form-select" id="curriculum" name="curriculum" required>
                                <option value="">Select Curriculum</option>
                                {% for curriculum in curriculums %}
                                    <option value="{{ curriculum.id }}">{{ curriculum.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject <span class="text-danger">*</span></label>
                            <select class="form-select" id="subject" name="subject" required>
                                <option value="">Select Subject</option>
                                {% for subject in subjects %}
                                    <option value="{{ subject.id }}">{{ subject.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="grade_level" class="form-label">Grade/Form <span class="text-danger">*</span></label>
                            <select class="form-select" id="grade_level" name="grade_level" required>
                                <option value="">Select Grade</option>
                                {% for grade in grade_levels %}
                                    <option value="{{ grade.id }}">{{ grade.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="stream" class="form-label">Stream <span class="text-danger">*</span></label>
                            <select class="form-select" id="stream" name="stream" required>
                                <option value="">Select Stream</option>
                                {% for stream in streams %}
                                    <option value="{{ stream.id }}">{{ stream.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="academic_year" class="form-label">Academic Year <span class="text-danger">*</span></label>
                            <select class="form-select" id="academic_year" name="academic_year" required>
                                <option value="">Select Academic Year</option>
                                {% for year in academic_years %}
                                    <option value="{{ year.id }}" {% if year.is_current %}selected{% endif %}>{{ year.year }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="is_class_teacher" name="is_class_teacher">
                            <label class="form-check-label" for="is_class_teacher">Assign as Class Teacher</label>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-check"></i> Assign Teacher
                            </button>
                            <a href="{% url 'teachers:detail' teacher.id %}" class="btn btn-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
