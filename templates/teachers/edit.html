{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Teacher - EduGrade{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="fas fa-edit"></i> Edit Teacher: {{ teacher.full_name }}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="border-bottom pb-2">Personal Information</h5>
                                <div class="mb-3">
                                    <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="first_name" name="first_name" value="{{ teacher.first_name }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="tsc_number" class="form-label">TSC Number</label>
                                    <input type="text" class="form-control" id="tsc_number" name="tsc_number" value="{{ teacher.tsc_number|default:'' }}">
                                </div>
                                <div class="mb-3">
                                    <label for="middle_name" class="form-label">Middle Name</label>
                                    <input type="text" class="form-control" id="middle_name" name="middle_name" value="{{ teacher.middle_name|default:'' }}">
                                </div>
                                <div class="mb-3">
                                    <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ teacher.last_name }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                                    <select class="form-select" id="gender" name="gender" required>
                                        <option value="">Select Gender</option>
                                        {% for code, name in gender_choices %}
                                            <option value="{{ code }}" {% if teacher.gender == code %}selected{% endif %}>{{ name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="date_of_birth" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ teacher.date_of_birth|date:'Y-m-d' }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h5 class="border-bottom pb-2">Contact & Employment</h5>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" name="email" value="{{ teacher.email }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="phone_number" class="form-label">Phone Number <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ teacher.phone_number }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="address" class="form-label">Address</label>
                                    <textarea class="form-control" id="address" name="address" rows="2">{{ teacher.address|default:'' }}</textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="employment_date" class="form-label">Employment Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="employment_date" name="employment_date" value="{{ teacher.employment_date|date:'Y-m-d' }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="qualification" class="form-label">Qualification <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="qualification" name="qualification" value="{{ teacher.qualification }}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="specialization" class="form-label">Specialization</label>
                                    <input type="text" class="form-control" id="specialization" name="specialization" value="{{ teacher.specialization|default:'' }}">
                                </div>
                                <div class="mb-3">
                                    <label for="status" class="form-label">Status</label>
                                    <select class="form-select" id="status" name="status">
                                        {% for code, name in status_choices %}
                                            <option value="{{ code }}" {% if teacher.status == code %}selected{% endif %}>{{ name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-warning btn-lg">
                                <i class="fas fa-save"></i> Update Teacher
                            </button>
                            <a href="{% url 'teachers:detail' teacher.id %}" class="btn btn-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
