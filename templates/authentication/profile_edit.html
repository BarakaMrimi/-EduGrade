{% extends 'base.html' %}
{% block title %}Edit Profile - EduGrade{% endblock %}
{% block page_title %}Edit My Profile{% endblock %}
{% block content %}
<div class="container-fluid"><div class="row justify-content-center"><div class="col-lg-8"><div class="card-custom"><div class="card-header"><i class="fas fa-user-edit me-2"></i>Professional Profile</div><div class="card-body"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input name="first_name" class="form-control" value="{{ user.first_name }}" required></div><div class="col-md-6"><label class="form-label">Last name</label><input name="last_name" class="form-control" value="{{ user.last_name }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ user.email }}" required></div><div class="col-md-6"><label class="form-label">Phone number</label><input name="phone_number" class="form-control" value="{{ teacher.phone_number|default:'' }}" required></div><div class="col-md-6"><label class="form-label">TSC number</label><input name="tsc_number" class="form-control" value="{{ teacher.tsc_number|default:'' }}" placeholder="Enter TSC number"></div><div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="3">{{ teacher.address|default:'' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Save Changes</button><a href="{% url 'authentication:profile' %}" class="btn btn-outline-secondary ms-2">Cancel</a></div></form></div></div></div></div></div>
{% endblock %}
